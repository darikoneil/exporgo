# ReadTheDocs build configuration for exporgo.
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The project is uv-managed, so the build bootstraps uv, syncs the environment with the
# `docs` and `datastore` extras (datastore is needed so autodoc can import the
# polars/pyarrow-backed modules), and runs Sphinx directly into RTD's output directory.
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  commands:
    # `pip install uv` here only bootstraps the uv binary; uv manages every dependency.
    - pip install uv
    - uv sync --extra docs --extra datastore
    - uv run sphinx-build -T -b html docs/source $READTHEDOCS_OUTPUT/html
