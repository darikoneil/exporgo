name: rust-ci

on:
  push:
    branches: [master, science]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "template/**"
      - ".gitattributes"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "template/**"
      - ".gitattributes"
      - ".github/workflows/rust-ci.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The library must stay buildable without the CLI (for a future GUI).
      - run: cargo check --no-default-features
