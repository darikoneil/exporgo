[project]
name = "exporgo"
version = "2.0.3"
description = "Experiment organization, logging, and analysis monitoring for scientific studies."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = [
    "Neuroscience", "Science", "Experiment", "Organization", "Logging", "Provenance"
]
authors = [
  {name = "Darik A. O'Neil"}
]
maintainers = [
    {name = "Darik A. O'Neil"}
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Base dependencies (logging framework only; keep this minimal).
dependencies = [
    "loguru",
    "pydantic",
    "polars>=1.44.0",
    "tomli-w",
]

[project.urls]
documentation = "https://github.com/darikoneil/exporgo"
repository = "https://github.com/darikoneil/exporgo"

# Optional runtime extras — layered. `study` is the shared foundation (the Study &
# Identity model); `monitor` and `datastore` build on it. Base install stays loguru-only.
[project.optional-dependencies]
monitor = []
datastore = [
    "numpy",
    "polars[numpy,pyarrow]",
    "pyarrow==24.0.0",
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "autodoc_pydantic",
    "sphinx-rtd-theme",
]

[dependency-groups]
dev = [
    "coverage[toml]",
    "pyrefly",
    "pytest",
    "pytest-sugar",
    "pytest-clarity",
    "ruff",
    # Present so the optional numpy/polars/tqdm logging paths can be exercised
    # in the test suite even though they are not runtime dependencies.
    "numpy",
    "polars",
    "tqdm",
]


#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
#// BUILD CONFIGURATION (SETUPTOOLS)
#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exporgo*"]
namespaces = false


#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
#// TEST + COVERAGE CONFIGURATION
#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "-s",
    "--color=yes",
    "-vv",
    "-p no:cacheprovider",
    "--diff-width=88",
    "--basetemp=.pytest_tmp",  # project-local tmp; avoids the broken %TEMP%/pytest-of-<user>
]
testpaths = ["tests"]
console_output_style = "progress"

[tool.coverage.run]
branch = true
command_line = "-m pytest"
omit = [
    "*/tests/*",
    "*/*JetBrains*/*",
    "*/*PyCharm*Professional*/*",
]
dynamic_context = "test_function"

[tool.coverage.report]
fail_under = 75
exclude_also = [
    "def __repr__",
    "def __name__",
    "def __del__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError",
    "@(abc\\.)?abstractmethod",
    "@(abc\\.)?abstractproperty",
    "@(abc\\.)?abstractclassmethod",
    "@(abc\\.)?abstractstaticmethod",
]

[tool.coverage.json]
pretty_print = true

[tool.coverage.html]
show_contexts = true


#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
#// LINT + FORMAT CONFIGURATION (RUFF)
#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

[tool.ruff]
target-version = "py312"
exclude = [
    "*/tests/*",
    "*/report_scripts/*",
    "*/Scratches/*",
    "*/scratch/*",
    "*/.idea/*",
    "*/.git/*",
    "*/.github/*",
    "*/.vscode/*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "*/*.egg-info/*",
    "*/build/*",
    "*/dist/*",
    "*/.mypy_cache/*",
    "*/.tox/*",
    "*coverage*",
    "*/.cache/*",
    "*/docs/*",
    "*/venv/*",
    ".venv",
    "*/.venv/*",
    "*.gitignore",
    "README.md",
    "LICENSE",
    ".flake8",
    "*/linting/*",
    ".readthedocs.yaml",
    "*/Scratches and Consoles/*",
    "*/External Libraries/*",
    "*/assets/*",
    "*.ipynb",
    "*.pyx",
    "*.cpp",
    "*.pyd",
    "*.pxd",
]
line-length = 88 # Black Compatibility
indent-width = 4 # Black Compatibility
output-format = "json"

[tool.ruff.lint]
select = ["ALL", ]
extend-select = [
    "PLR0917", # too many positional arguments; backs the >3-args keyword-only rule in CLAUDE.md
]
ignore = [
    # /////////////////////////////////////////////////////////
    # IGNORE THESE ENTIRE MODULES
    # /////////////////////////////////////////////////////////
    "C90", # mccabe complexity
    "CPY", # flake8-copyright (per-file copyright headers not required)
    "DJ",  # django
    "EXE", # flake8-executable
    "PD", # pandas
    "PL", # pylint
    "PLR", # pylint refactor is super opinionated (except PLR0917, re-enabled above)
    "T10", # debugger
    "TID", # flake8-tidy-imports
    # /////////////////////////////////////////////////////////
    # IGNORE THESE SPECIFIC RULES
    # /////////////////////////////////////////////////////////
    "ANN204", # missing return type special message
    "COM812", # missing trailing comma
    "ANN401", # use of any type
    "ANN002", # missing type args
    "ANN003", # missing type kwargs
    "E203", # whitespace before punctuation
    "E501", # line too long
    "E701", # multiple statements one line
    "COM818", # missing trailing comma on bare-tuple
    'ERA001', # commented out code
    'T201', # Code comments
    'RET503', # No explicit return None
    'FIX002', # Fixme comments
    'FIX004', # Fixme comments
    "TD002", # missing author on todo admons
    "TD003", # missing link on todo
    "TRY003", # external messages in exceptions are too verbose
    "S101", # assert
    "ICN001", # unconventional import alias (sometimes this is needed)
    "FBT001", # boolean type hint as positional argument (not a bad practice in moderation imo)
    "FBT002", # boolean default value (not a bad practice in moderation imo)
    "FBT003", # boolean default value (not a bad practice in moderation imo)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["pydantic.Field", ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.ruff.format]
quote-style = "double"  # Black Compatibility
indent-style = "space"  # Black Compatibility
skip-magic-trailing-comma = false  # Black Compatibility
line-ending = "auto"  # Black Compatibility
docstring-code-format = true  # Auto-formatting of code examples in docstrings
docstring-code-line-length = "dynamic"  # Line length for code examples in docstrings


#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
#// TYPE CHECKING CONFIGURATION (PYREFLY)
#///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

[tool.pyrefly]
python-version = "3.12"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "**/scratch/**",
    "**/tests/**",
]
